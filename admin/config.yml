# 写书编辑页（Sveltia CMS），用 GitHub 令牌登录，保存即提交到 main。
# 「随笔」的字段名就是随笔文件头里的键，和 scripts/build_site.py 的 NOTE_META_KEYS 对应，改名要两边一起改。
# 「用于哪一章」的选项和「书稿」栏由构建脚本按 src/SUMMARY.md 生成，见 build_site.py 的 admin_config()，这里不手写。
backend:
  name: github
  repo: lyteboat/nook
  branch: main
  commit_messages:
    create: "随笔：新建 {{slug}}"
    update: "编辑页：修改 {{slug}}"
    delete: "随笔：删除 {{slug}}"
    uploadMedia: "编辑页：上传图片 {{path}}"
    deleteMedia: "编辑页：删除图片 {{path}}"

site_url: https://lyteboat.github.io/nook/
display_url: https://lyteboat.github.io/nook/notes.html
media_folder: notes/images
public_folder: /nook/notes/images

collections:
  - name: notes
    label: 随笔
    label_singular: 随笔
    description: 随手写的想法和素材，以后整理进书里。
    folder: notes
    extension: md
    format: frontmatter
    create: true
    delete: true
    path: "{{year}}/{{slug}}"
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}"
    identifier_field: 标题
    summary: "{{状态}} · {{标题}}"
    fields:
      - {name: 标题, label: 标题, widget: string}
      - {name: 状态, label: 状态, widget: select, options: [草稿, 已发布], default: 草稿, hint: "草稿不上站点；改成已发布并保存，1 到 2 分钟后所有人可见"}
      - {name: 章节, label: 用于哪一章, widget: select, required: false, options: []}  # 构建时填入
      - {name: body, label: 正文, widget: markdown}
  # 书稿栏：构建时追加在这里
