<title>随笔标题</title>
<!--
Nook 随笔模板。复制为 notes/YYYY/YYYY-MM-DD-英文短名.html，文件名的日期是写成那天，短名只用小写字母、数字和连字符。
样式由站点统一提供，这里只写正文，不加 <style>。

写法（data-kind）四选一：
- 札记：一个念头，三五百字。
- 长文：一个想清楚的观点。
- 复盘：一次实践的背景、做法、结果、教训。
- 过招：和 Claude 讨论后的学习报告。
data-ref 可选，写这篇引用的那一期雷达日期，比如 2026-10-28，页尾会链到那一期。
标题 8 到 24 个字，直接写观点或对象，不写写法名。正文用 p、h2、ul、ol、blockquote、a。
-->
<article class="note" data-kind="札记" data-ref="">
<h1>随笔标题</h1>
<p>正文第一段。</p>
</article>
